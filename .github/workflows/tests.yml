name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abacuslite_ref:
        description: "abacuslite commit, tag, or branch for coordinated candidate validation"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ASE ${{ matrix.ase-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        ase-version: ["3.28.0", "latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ATST-Tools test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Select ASE compatibility version
        env:
          ASE_VERSION: ${{ matrix.ase-version }}
        run: |
          if [[ "$ASE_VERSION" == "latest" ]]; then
            python -m pip install --upgrade ase
          else
            python -m pip install "ase==$ASE_VERSION"
          fi
          python -m pip check

      - name: Run unit tests
        run: |
          python -m pytest tests -q

  external-abacuslite-candidate:
    name: paired installed abacuslite consumer parity
    runs-on: ubuntu-latest
    env:
      ABACUSLITE_PIN: 06f97b1bda59f3d29e93dd5c7a4bf598808b89b8
      DISPATCH_REF: ${{ inputs.abacuslite_ref }}

    steps:
      - name: Checkout ATST-Tools
        uses: actions/checkout@v4

      - name: Resolve abacuslite candidate ref
        id: candidate
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            ref=main
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_REF" ]]; then
            ref="$DISPATCH_REF"
          else
            ref="$ABACUSLITE_PIN"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed abacuslite candidate
        uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/abacuslite
          ref: ${{ steps.candidate.outputs.ref }}
          path: abacuslite-candidate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build both wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/plugin-dist" abacuslite-candidate
          python -m build --wheel --outdir "$RUNNER_TEMP/atst-dist" .
          git -C abacuslite-candidate rev-parse HEAD
          sha256sum "$RUNNER_TEMP"/plugin-dist/*.whl "$RUNNER_TEMP"/atst-dist/*.whl
          if [[ "$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            test "$(git -C abacuslite-candidate rev-parse HEAD)" = "$ABACUSLITE_PIN"
          fi

      - name: Install identical ATST wheels in isolated environments
        run: |
          ATST_WHEEL=("$RUNNER_TEMP"/atst-dist/*.whl)
          PLUGIN_WHEEL=("$RUNNER_TEMP"/plugin-dist/*.whl)
          test "${#ATST_WHEEL[@]}" -eq 1
          test "${#PLUGIN_WHEEL[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/venv-vendored"
          python -m venv "$RUNNER_TEMP/venv-external"
          for lane in vendored external; do
            PYTHON="$RUNNER_TEMP/venv-$lane/bin/python"
            "$PYTHON" -m pip install --upgrade pip
            "$PYTHON" -m pip install "${ATST_WHEEL[0]}[test]" 'ase==3.28.0'
            if [[ "$lane" == external ]]; then
              "$PYTHON" -m pip install "${PLUGIN_WHEEL[0]}"
            fi
            "$PYTHON" -m pip check
          done

      - name: Run paired installed-wheel consumer suite
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-vendored/bin/python" "$GITHUB_WORKSPACE/scripts/run_abacuslite_consumer.py" --atst-root "$GITHUB_WORKSPACE" --backend vendored --report "$RUNNER_TEMP/vendored.json"
          "$RUNNER_TEMP/venv-external/bin/python" "$GITHUB_WORKSPACE/scripts/run_abacuslite_consumer.py" --atst-root "$GITHUB_WORKSPACE" --backend external --report "$RUNNER_TEMP/external.json"
          "$RUNNER_TEMP/venv-external/bin/python" "$GITHUB_WORKSPACE/scripts/run_abacuslite_consumer.py" --compare "$RUNNER_TEMP/vendored.json" "$RUNNER_TEMP/external.json"

      - name: Preserve consumer reports and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abacuslite-consumer-parity
          path: |
            ${{ runner.temp }}/*external*.json
            ${{ runner.temp }}/*vendored*.json
            ${{ runner.temp }}/*external*.log
            ${{ runner.temp }}/*vendored*.log
            ${{ runner.temp }}/*external*.xml
            ${{ runner.temp }}/*vendored*.xml

  documentation-governance:
    name: documentation governance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ATST-Tools test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check documentation governance
        run: |
          python scripts/check_docs_governance.py

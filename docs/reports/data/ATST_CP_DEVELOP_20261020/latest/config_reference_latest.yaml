      ks_solver: cusolver
      nspin: 1
      nbands: 130
      smearing_method: gauss
      smearing_sigma: 0.015
      mixing_type: broyden
      mixing_beta: 0.1
      out_pot: 2
      nelec: 217
      pseudo_dir: /home/galileo-group/galileouser02/atst-cp-parity-20261019/case
      orbital_dir: /home/galileo-group/galileouser02/atst-cp-parity-20261019/case

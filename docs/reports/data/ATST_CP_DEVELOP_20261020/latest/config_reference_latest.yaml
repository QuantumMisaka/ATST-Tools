        Pt: Pt_ONCV_PBE-1.0.upf
      basissets:
        Pt: Pt_gga_7au_100Ry_4s2p2d1f.orb
  constant_potential:
    energy_boundary: reference_fcp
    reference_electrode: SHE
    reference_electrons: 216
    potential_v: 0.4
    work_ref: 4.6
    work_ref_source: FCP v2 reference parity
    potential_tolerance_v: 1e-4
    max_iterations: 100
    capacitance_initial: 0.0125
